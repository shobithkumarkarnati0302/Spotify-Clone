            <div class="icons">
                <img src="/svgs/shuffle.svg" alt="backward" id="shuffle">
                <img src="/svgs/backward.svg" alt="backward" id="previous">
                <img src="/svgs/play.svg" alt="play" id="masterPlay">
                <img src="/svgs/forward.svg" alt="forward" id="next">
                <img src="/svgs/repeat.svg" alt="forward" id="repeat">

            <div class="songInfo">
